name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # The Postgres specs that need a server (createDatabase.postgres,
    # postgres.integration, postgres.dialect.integration, postgres.segment,
    # postgres.pool and the key-value store's) run against this one. They read
    # POSTGRES_TEST_URL. DATABASE_URL stays unset here: it moves the resolver's
    # default to Postgres for every other suite. The image is PostgreSQL 16 with
    # the pgvector extension available, so the segment specs can check that the
    # vector type resolves through public. The sync suites (tests/mutations) read
    # SYNC_TEST_POSTGRES_URL, and SYNC_TEST_REQUIRE_POSTGRES=1 makes them fail
    # when it is missing instead of leaving Postgres out.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: adapter
          POSTGRES_PASSWORD: adapter
          POSTGRES_DB: adapter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adapter -d adapter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Europe/Berlin
      POSTGRES_TEST_URL: postgresql://adapter:adapter@localhost:5432/adapter_test
      SYNC_TEST_REQUIRE_POSTGRES: '1'
      SYNC_TEST_POSTGRES_URL: postgresql://adapter:adapter@localhost:5432/adapter_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # master's rules refuse a direct push (GH006), so a workflow step that pushes a commit there fails after
      # everything before it has run. This fails the pull request that adds such a push; its tests show each kind
      # of push it reads. It reads the YAML with yq, which the Ubuntu runner carries.
      - name: No workflow pushes to master
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --test .github/scripts/check-workflow-pushes.test.mjs
          node .github/scripts/check-workflow-pushes.mjs

      - name: Install dependencies
        run: npm install

      # A PostgreSQL that offers TLS with a certificate made for this run, for
      # localhost, which no public certificate authority signed, so that
      # tests/postgres.exporter.tls.spec.ts can show pg_dump checking a server
      # as pg does. The spec reads POSTGRES_TLS_TEST_URL and
      # POSTGRES_TLS_ROOT_CERT. The server reads its key only when the
      # postgres user (uid 999 in the image) owns it with mode 0600.
      - name: Start a PostgreSQL that offers TLS
        run: |
          dir="$RUNNER_TEMP/pg-tls"
          mkdir -p "$dir"
          openssl req -new -x509 -days 2 -nodes -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$dir/server.key" -out "$dir/server.crt"
          chmod 644 "$dir/server.crt"
          chmod 600 "$dir/server.key"
          sudo chown 999:999 "$dir/server.key"
          docker run -d --name pg-tls -p 5433:5432 \
            -e POSTGRES_USER=adapter -e POSTGRES_PASSWORD=adapter -e POSTGRES_DB=adapter_test \
            -v "$dir:/tls:ro" postgres:16 \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for i in $(seq 1 90); do
            if docker exec pg-tls pg_isready -U adapter -d adapter_test -h localhost >/dev/null 2>&1; then
              echo "POSTGRES_TLS_TEST_URL=postgresql://adapter:adapter@localhost:5433/adapter_test" >> "$GITHUB_ENV"
              echo "POSTGRES_TLS_ROOT_CERT=$dir/server.crt" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs pg-tls
          exit 1

      - name: Lint
        run: npm run lint || true

      - name: TypeCheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Run tests with coverage
        run: |
          : "${POSTGRES_TEST_URL:?Coverage requires the PostgreSQL integration service}"
          npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      # A consumer on --module nodenext reads the packed declarations as an ES
      # module, where a relative specifier resolves only when it names its file.
      - name: Type-check a NodeNext consumer of the packed package
        run: |
          pack_dir="$RUNNER_TEMP/pack"
          consumer_dir="$RUNNER_TEMP/nodenext-consumer"
          mkdir -p "$pack_dir" "$consumer_dir"
          npm pack --pack-destination "$pack_dir"
          cd "$consumer_dir"
          echo '{ "name": "nodenext-consumer", "private": true, "type": "module" }' > package.json
          # @types/pg so that a pg Pool, as a host holds one, is checked against the adapter's pool option.
          # @auth/core so that createAuthJsAdapter is checked against Auth.js's own Adapter type.
          npm install --no-audit --no-fund "$pack_dir"/*.tgz @types/pg @auth/core
          cat > index.ts <<'EOF'
          import type { Pool } from 'pg';
          import type { Adapter } from '@auth/core/adapters';
          import { createAuthJsAdapter } from '@framers/sql-storage-adapter/authjs';
          import {
            createDatabase,
            createPostgresAdapter,
            resolveStorageAdapter,
            type PostgresAdapter,
            type StorageAdapter,
            type SqlDialect,
          } from '@framers/sql-storage-adapter';
          import {
            createSqlKeyValueStore,
            namespaced,
            openIndexedDbStore,
            type KeyValueStore,
          } from '@framers/sql-storage-adapter/kv';
          import {
            MutationClient,
            IndexedDbAdapter,
            createTabLock,
            upgradeClientTables,
            type ClientSnapshot,
            type RowPolicy,
          } from '@framers/sql-storage-adapter/browser';
          import {
            MutationServer,
            createSqlMutationStore,
            DrainGate,
            PROTOCOL,
            upgradeSqlMutationStore,
            type MutationServerOptions,
            type PullRefusal,
            type PushAnswer,
            type RowComposer,
          } from '@framers/sql-storage-adapter/sync';

          declare const legacyDialect: Omit<SqlDialect, 'syncIdentitySequence'>;
          export const compatibleDialect: SqlDialect = legacyDialect;
          export const syncIfAvailable = (dialect: SqlDialect) =>
            dialect.syncIdentitySequence?.('items', 'id') ?? null;

          export const openDefault = (): Promise<StorageAdapter> => createDatabase({ segment: 'agentos' });
          export const openResolved = (): Promise<StorageAdapter> => resolveStorageAdapter();
          export const openPostgres = (url: string): StorageAdapter => createPostgresAdapter(url);
          export const openOnPool = (pool: Pool): StorageAdapter =>
            createPostgresAdapter({ pool, ownsPool: true, onError: (error: Error) => console.error(error) });
          export const poolOf = (adapter: PostgresAdapter) => adapter.getPool();
          export const openKv = async (adapter: StorageAdapter): Promise<KeyValueStore> =>
            namespaced(await createSqlKeyValueStore(adapter, { table: 'agentos_kv' }), 'user/');
          export const openBrowserKv = (): Promise<KeyValueStore> => openIndexedDbStore({ dbName: 'app', storeName: 'kv' });
          export const authAdapter = (adapter: StorageAdapter): Adapter => createAuthJsAdapter(adapter);
          export const kinds = [MutationClient, IndexedDbAdapter, createTabLock, MutationServer, createSqlMutationStore, DrainGate].map((value) => typeof value);
          // Content revisions as a consumer types them: a composer and the policy that takes it, a server
          // narrowed to this release's protocol, both upgrades, a save that claims a derived id, a
          // protocol_changed answer, a kept row refused as occupied and a row's content revision.
          export const composer: RowComposer = {
            contentOf: (value) => value.split('|')[0],
            compose: (current, content, delta) => `${content ?? current.split('|')[0]}|${delta ?? current.split('|')[1]}`,
            deltaOf: (before, after) => (before.split('|')[1] === after.split('|')[1] ? null : after.split('|')[1]),
            sameClaim: (current, incoming) => current === incoming,
          };
          export const policy: RowPolicy = { maxRows: 100, maxUnits: 10_000, copyValue: (value) => `${value} (copy)`, composer };
          export const narrowed = (options: MutationServerOptions): MutationServer =>
            new MutationServer({ ...options, policy, protocols: [PROTOCOL] });
          export const upgradeStore = (adapter: StorageAdapter): Promise<void> => upgradeSqlMutationStore(adapter, 'notes_');
          export const upgradePage = (adapter: StorageAdapter): Promise<void> => upgradeClientTables(adapter, 'sync_');
          export const claim = (client: MutationClient, id: string) =>
            client.save({ rows: [{ id, value: 'copy|', claim: true }], write: async () => undefined });
          export const protocolsTaken = (answer: PushAnswer | PullRefusal): number[] =>
            answer.kind === 'protocol_changed' ? answer.protocols : [];
          export const occupied = (snapshot: ClientSnapshot): string[] =>
            snapshot.kept.filter((row) => row.reason === 'occupied').map((row) => row.value);
          export const contentRevisions = (snapshot: ClientSnapshot): Array<string | null> =>
            snapshot.visible.map((row) => row.contentRevision?.mutation ?? null);
          EOF
          tsc="$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          "$tsc" --version
          "$tsc" --module nodenext --moduleResolution nodenext --strict --skipLibCheck --noEmit index.ts
          # With library checks on, as a consumer that checks the declarations it reads compiles them: every module
          # the packed declarations import has types once the package is installed. Errors in other packages'
          # declarations (@auth/core, pg-protocol) are theirs; an error in this package's declarations fails the step.
          code=0
          "$tsc" --module nodenext --moduleResolution nodenext --strict --noEmit index.ts > lib-check.txt 2>&1 || code=$?
          own="$(grep -E '^node_modules/@framers/sql-storage-adapter/.*error TS[0-9]+' lib-check.txt || true)"
          if [ -n "$own" ]; then
            echo "$own"
            exit 1
          fi
          # A compiler that fails and prints no error line checked nothing.
          if [ "$code" -ne 0 ] && ! grep -q 'error TS' lib-check.txt; then
            cat lib-check.txt
            exit 1
          fi

      # The CommonJS build and the per-adapter entries, as a consumer installs
      # them: a CommonJS TypeScript consumer under node16 resolution, require()
      # of every entry, what each entry bundles, and the bundled preload.
      - name: Check the packed package's CommonJS build and entries
        run: |
          consumer_dir="$RUNNER_TEMP/nodenext-consumer"
          cd "$consumer_dir"
          cat > cjs-consumer.cts <<'EOF'
          import { createDatabase, type StorageAdapter } from '@framers/sql-storage-adapter';
          import { createPostgresAdapter } from '@framers/sql-storage-adapter/postgres';
          import { SqliteDialect, isUniqueViolation, runSchemaMigrations } from '@framers/sql-storage-adapter/core';
          import { createElectronRendererAdapter } from '@framers/sql-storage-adapter/electron/renderer';
          import { MutationClient, upgradeClientTables } from '@framers/sql-storage-adapter/browser';
          import { MutationServer, PROTOCOL, upgradeSqlMutationStore, type RowComposer } from '@framers/sql-storage-adapter/sync';

          export const open = (): Promise<StorageAdapter> => createDatabase();
          export const openPostgres = (url: string): StorageAdapter => createPostgresAdapter(url);
          export const dialect = new SqliteDialect();
          export const migrate = runSchemaMigrations;
          export const unique = isUniqueViolation;
          export const renderer = createElectronRendererAdapter;
          export const client = MutationClient;
          export const server = MutationServer;
          export const protocol: number = PROTOCOL;
          export const upgrades = [upgradeSqlMutationStore, upgradeClientTables].map((upgrade) => typeof upgrade);
          export const sameClaim: RowComposer['sameClaim'] = (current, incoming) => current === incoming;
          EOF
          tsc="$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          "$tsc" --module node16 --moduleResolution node16 --strict --skipLibCheck --noEmit cjs-consumer.cts
          node "$GITHUB_WORKSPACE/scripts/verify-package.mjs" "$consumer_dir"


  postgres18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: adapter
          POSTGRES_PASSWORD: adapter
          POSTGRES_DB: adapter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adapter -d adapter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Europe/Berlin
      POSTGRES_TEST_URL: postgresql://adapter:adapter@localhost:5432/adapter_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run migration specs on PostgreSQL 18
        run: npx vitest run tests/migrateAdapter.engines.spec.ts

  # The IndexedDB adapter's cross-tab coordination and durability, and the
  # key-value module, on the browsers' own IndexedDB, Web Locks and structured
  # clone: Chromium, WebKit and Firefox, through Playwright.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium, WebKit and Firefox
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Run the browser specs
        run: npx vitest run --config vitest.browser.config.ts
