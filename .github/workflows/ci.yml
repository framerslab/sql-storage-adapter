name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # The Postgres specs that need a server (tests/createDatabase.postgres.spec.ts)
    # run against this one. They read POSTGRES_TEST_URL; the older Postgres suites
    # read TEST_POSTGRES_URL and DATABASE_URL, which stay unset here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adapter
          POSTGRES_PASSWORD: adapter
          POSTGRES_DB: adapter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adapter -d adapter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://adapter:adapter@localhost:5432/adapter_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint || true

      - name: TypeCheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Run tests with coverage
        run: npx vitest run --coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      # A consumer on --module nodenext reads the packed declarations as an ES
      # module, where a relative specifier resolves only when it names its file.
      - name: Type-check a NodeNext consumer of the packed package
        run: |
          pack_dir="$RUNNER_TEMP/pack"
          consumer_dir="$RUNNER_TEMP/nodenext-consumer"
          mkdir -p "$pack_dir" "$consumer_dir"
          npm pack --pack-destination "$pack_dir"
          cd "$consumer_dir"
          echo '{ "name": "nodenext-consumer", "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "$pack_dir"/*.tgz
          cat > index.ts <<'EOF'
          import {
            createDatabase,
            createPostgresAdapter,
            resolveStorageAdapter,
            type StorageAdapter,
          } from '@framers/sql-storage-adapter';

          export const openDefault = (): Promise<StorageAdapter> => createDatabase();
          export const openResolved = (): Promise<StorageAdapter> => resolveStorageAdapter();
          export const openPostgres = (url: string): StorageAdapter => createPostgresAdapter(url);
          EOF
          tsc="$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          "$tsc" --version
          "$tsc" --module nodenext --moduleResolution nodenext --strict --skipLibCheck --noEmit index.ts
