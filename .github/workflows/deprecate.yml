name: Deprecate a version

# Marks a published version of @framers/sql-storage-adapter as deprecated,
# with the message npm shows on install, or clears the mark when clear is
# ticked. Maintainers start it by hand (Actions → Deprecate a version → Run
# workflow); it holds the npm token, so it runs nothing but npm, and its one
# action is pinned to a commit. A version is never unpublished: deprecation
# keeps every lockfile that names it installable.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to deprecate, such as 0.6.9 or 0.7.0-beta.1'
        required: true
      message:
        description: 'Why, and which version to use instead'
        required: false
        default: ''
      clear:
        description: 'Clear the version''s deprecation instead (leave the message empty)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The inputs reach the shell as variables, never as workflow expressions.
      - name: npm deprecate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
          CLEAR: ${{ inputs.clear }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$VERSION' is not a version such as 0.6.9 or 0.7.0-beta.1."
            exit 1
          fi
          # npm clears a deprecation when the message is empty, so an empty
          # message runs only with clear ticked, and clear only with no message.
          if [ "$CLEAR" = "true" ] && [ -n "$MESSAGE" ]; then
            echo "::error::Clear is ticked and a message is given; run again with one of them."
            exit 1
          fi
          if [ "$CLEAR" != "true" ] && [ -z "$MESSAGE" ]; then
            echo "::error::Give a message that says why and which version to use instead, or tick clear to remove the deprecation."
            exit 1
          fi
          npm view "@framers/sql-storage-adapter@${VERSION}" version >/dev/null
          npm deprecate "@framers/sql-storage-adapter@${VERSION}" "$MESSAGE"
          echo "@framers/sql-storage-adapter@${VERSION}: $(npm view "@framers/sql-storage-adapter@${VERSION}" deprecated || true)"
