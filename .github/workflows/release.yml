name: Release sql-storage-adapter

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One release run at a time, in the order the runs began to wait: a run that
# starts while another runs waits for it, and up to 100 wait (queue: max), so a
# newer run never replaces one still waiting. Each run decides its version from
# what the runs before it published, so no version is published twice and no
# publish is cancelled part way.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    # A run started by hand on another branch publishes nothing.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # npm trusted publishing exchanges this job's OIDC token for a publish token.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Every commit and tag: the decision finds the commit the newest
          # version was published from and compares this one with it.
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # A push that changed a file the package ships publishes the newest
      # published version with its patch raised by one, or package.json's
      # version when that is higher (RELEASING.md).
      - name: Decide the version to publish
        id: plan
        run: node scripts/release-version.mjs --notes "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm install

      - name: Run tests
        if: steps.plan.outputs.publish == 'true'
        run: npx vitest run

      - name: Build package
        if: steps.plan.outputs.publish == 'true'
        run: npm run build

      # Into this checkout's package.json alone: nothing is committed to master.
      - name: Write the version into package.json
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm 11.20.0 for trusted publishing
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@11.20.0 && npm --version

      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: steps.plan.outputs.publish == 'true'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.plan.outputs.version }}
          # A new tag names the commit this run published, not master's head when the release is made.
          commit: ${{ github.sha }}
          name: sql-storage-adapter v${{ steps.plan.outputs.version }}
          bodyFile: ${{ runner.temp }}/release-notes.md
          allowUpdates: true
