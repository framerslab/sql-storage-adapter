name: Review comments

# Posts ESLint's findings on the lines a pull request adds as review comments,
# through reviewdog. It never fails: the build job's lint step in ci.yml is
# unchanged, and this workflow is not a required check.
#
# There is no path filter. reviewdog deletes its earlier comments whose finding
# is gone, but only in a run, so a push that drops a pull request's last change
# under src/ still needs one.

on:
  pull_request:
    # edited runs the job only when the base branch changed (see the job's if),
    # so the comments follow the new diff; a title or body edit runs nothing.
    types: [opened, synchronize, reopened, edited]

# reviewdog's github-pr-review reporter creates, lists and deletes review
# comments; pull-requests is the one scope it writes.
permissions:
  contents: read
  pull-requests: write

# A title or body edit takes a group of its own (its run id), so it cancels no
# lint run; any other run replaces the one before it on the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'eslint' }}
  cancel-in-progress: true

jobs:
  eslint:
    # Forks are skipped: their token is read-only, so reviewdog could not post.
    # Runs that Dependabot triggers are skipped: Dependabot changes manifests,
    # never a line under src/, and skipping them keeps a newly bumped ESLint
    # package from running with this token. A maintainer's push to a Dependabot
    # branch still runs.
    # A branch of this repository runs its own packages and ESLint config with
    # this token; that gives its author nothing new, since they can already
    # change any workflow on the branch.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The pull request's head, so a finding's line number is its line in the diff.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # ESLint and its plugins are plain JavaScript: no build, no native modules.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Post ESLint findings on added lines
        uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1.36.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          # The action deprecates fail_on_error; fail_level none is its replacement and never fails.
          fail_level: none
          level: warning
          # The pattern of npm run lint. The inner quotes leave the glob for ESLint to expand.
          eslint_flags: '"src/**/*.{ts,tsx}"'
