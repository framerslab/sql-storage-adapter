name: Review comments

# Posts ESLint's findings on the lines a pull request adds as review comments,
# through reviewdog. It never fails: the build job's lint step in ci.yml is
# unchanged, and this workflow is not a required check. The path filter skips
# pull requests that change nothing ESLint reads, so it has to stay optional.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'eslint.config.js'
      - 'package.json'
      - '.github/workflows/review-comments.yml'

# reviewdog's github-pr-review reporter creates, lists and deletes review
# comments; pull-requests is the one scope it writes.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eslint:
    # A fork's token, and Dependabot's, can read the repository but cannot post a review.
    # The head's packages and ESLint config run with this token; that gives a branch's
    # author nothing new, since they can already change any workflow on the branch.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The pull request's head, so a finding's line number is its line in the diff.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # ESLint and its plugins are plain JavaScript: no build, no native modules.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Post ESLint findings on added lines
        uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1.36.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          # The action deprecates fail_on_error; fail_level none is its replacement and never fails.
          fail_level: none
          level: warning
          # The pattern of npm run lint. The inner quotes leave the glob for ESLint to expand.
          eslint_flags: '"src/**/*.{ts,tsx}"'
